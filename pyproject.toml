[project]
name = "compliance-evidence-skills"
version = "0.7.0"
description = "Claude Code skills for compliance evidence: integrity-checked evidence packs from GitHub, AWS and Microsoft 365 exports, ISO 27001 and SOC 2 control mapping by identifier, cited auditor narratives, security questionnaire drafts, an Essential Eight evidence map, a vendor attestation digest, a Maester results control map and an evidence collection plan (PBC list with freshness tracking)."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
