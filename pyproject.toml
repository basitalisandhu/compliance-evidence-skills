[project]
name = "compliance-evidence-skills"
version = "0.1.1"
description = "Claude Code skills for compliance evidence: integrity-checked evidence packs from GitHub, AWS and Microsoft 365 exports, ISO 27001 and SOC 2 control mapping by identifier, and cited auditor narratives."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
